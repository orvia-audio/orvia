name: macOS and Linux
on:
  push:
    paths-ignore:
      - "site/**"
      - "docs/samples/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/samples/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Link the PR snapshot review
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TARGET: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "[Review this PR's snapshots](https://orvia.s7a.dev/review/?pr=$PR_HEAD&target=$PR_TARGET&pull=$PR_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
      - name: Select Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy
          rustup override set 1.93.1
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig1-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev libvulkan-dev clang libclang-dev libssl-dev dpkg-dev pipewire-pulse wireplumber pulseaudio-utils espeak-ng xvfb xauth xdotool mesa-vulkan-drivers fonts-dejavu-core fonts-noto-cjk python3-pil python3-fonttools openbox imagemagick x11-utils
      - name: Check native code
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo test --locked -p dfn3_rs
      - name: Compare desktop UI snapshots
        if: runner.os == 'Linux'
        run: sh tests/ui/run.sh
      - name: Upload changed UI snapshots
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-snapshot-differences
          path: target/ui-snapshots/
          if-no-files-found: ignore
      - name: Install cargo-about
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) target=aarch64-apple-darwin ;;
            Linux-x86_64) target=x86_64-unknown-linux-musl ;;
            *) cargo install cargo-about --version 0.9.3 --features cli --locked; exit ;;
          esac
          name=cargo-about-0.9.3-$target
          url=https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/$name.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSLO "$url"
          expected=$(curl -fsSL "$url.sha256" | awk '{print $1}')
          echo "$expected  $name.tar.gz" | shasum -a 256 -c -
          tar -xzf "$name.tar.gz"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Package
        run: bash installer/desktop.sh
      - name: Record through the installed virtual microphone
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a dbus-run-session -- python3 installer/linux/test-route.py
      - name: Open the packaged macOS mixer
        if: runner.os == 'macOS'
        run: |
          mount="$RUNNER_TEMP/orvia-volume"
          hdiutil attach -nobrowse -mountpoint "$mount" dist/*.dmg
          ditto "$mount/Orvia.app" "$RUNNER_TEMP/Orvia.app"
          hdiutil detach "$mount"
          codesign --verify --deep --strict "$RUNNER_TEMP/Orvia.app"
          open "$RUNNER_TEMP/Orvia.app"
          state="$HOME/Library/Application Support/Orvia"
          for i in {1..45}; do
            if test -s "$state/status.json"; then break; fi
            sleep 1
          done
          jq -e '.version and (.message | contains("Choose a virtual output"))' "$state/status.json"
          touch "$state/close-window" "$state/stop-engine-$(cat "$state/engine.lock")"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Orvia-${{ runner.os }}-${{ runner.arch }}
          path: dist/Orvia-*
          if-no-files-found: error
