name: GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/ui/snapshots/**"
      - "docs/samples/*.flac"
      - "docs/samples/compare-16s.mp4"
      - "assets/mixer.png"
      - "assets/orvia.svg"
      - "assets/tabler/**"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v6.0.0
      - run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/pages
      - name: Publish the site
        id: deploy
        uses: actions/deploy-pages@v5.0.1
