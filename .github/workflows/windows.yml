name: Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Select the Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.93.1
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint all Rust targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test audio processing and documentation examples
        run: cargo test --workspace --locked
      - name: Build Rustdoc
        run: cargo doc --workspace --no-deps --locked
      - name: Install packaging tools
        shell: pwsh
        run: |
          dotnet tool install wix --version 4.0.6 --tool-path target/tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $name = 'cargo-about-0.9.3-x86_64-pc-windows-msvc'
          $url = "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/$name.tar.gz"
          Invoke-WebRequest $url -OutFile target/tools/about.tar.gz
          $checksum = (Invoke-RestMethod "$url.sha256").Trim().Split(' ')[0]
          if ((Get-FileHash target/tools/about.tar.gz).Hash -ne $checksum) { throw 'Archive checksum mismatch' }
          tar -xf target/tools/about.tar.gz -C target/tools
          (Resolve-Path target/tools).Path >> $env:GITHUB_PATH
          (Resolve-Path "target/tools/$name").Path >> $env:GITHUB_PATH
      - name: Package Orvia for installed virtual cables
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          powershell -NoProfile -File installer\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: orvia-windows-x64
          path: |
            dist/*.msi
            dist/THIRD-PARTY-NOTICES.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Restore the Windows Driver Kit
        run: nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.6584 -OutputDirectory target/wdk -Source https://api.nuget.org/v3/index.json -NonInteractive
      - name: Build and package the test driver
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          powershell -NoProfile -File driver\build.ps1 -TestSign
          if errorlevel 1 exit /b 1
          powershell -NoProfile -File installer\build.ps1 -WithTestDriver
      - uses: actions/upload-artifact@v4
        with:
          name: orvia-windows-x64-test
          path: dist/lab/
          if-no-files-found: error
