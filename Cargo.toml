[workspace]
members = ["crates/core", "crates/engine", "crates/settings"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/sya-ri/orvia"
rust-version = "1.93"

[workspace.metadata.windows-installer]
# This numeric series follows the previously distributed 0.3.1 MSI.
series = "0.4"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.dev]
debug = 0
