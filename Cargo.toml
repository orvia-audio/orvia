[workspace]
members = ["crates/core", "crates/engine", "crates/settings"]
resolver = "3"

[patch.crates-io]
# CPAL 0.18.2 leaks the string returned by WASAPI's GetId. Use the upstream stable-0.18 fix.
cpal = { git = "https://github.com/RustAudio/cpal.git", rev = "450afe54bf205ac90cf4219ae9b126d4eb3f5e8b" }
pulseaudio = { git = "https://github.com/orvia-audio/pulseaudio-rs.git", rev = "85dfd0f3834adc8f533bb0b0d8775729e35e3d32" }
tray-item = { git = "https://github.com/orvia-audio/tray-item-rs.git", rev = "529412f75b6a754a72e5c6e20faf0ce38f5c0389" }

[workspace.package]
edition = "2024"
version = "0.1.6"
license = "MIT"
repository = "https://github.com/orvia-audio/orvia"
rust-version = "1.93"

[workspace.metadata.windows-installer]
# Each stable release and its preceding snapshots share a Windows Installer series.
series = "0.10"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Keep the model's feature-detected kernels compact in distribution builds.
[profile.release.package.dfn3_rs]
opt-level = 2

[profile.dev]
debug = 0
