[workspace]
members = ["crates/core", "crates/engine", "crates/settings", "vendor/dfn3_rs"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.6-snapshot.3"
license = "MIT"
repository = "https://github.com/sya-ri/orvia"
rust-version = "1.93"

[workspace.metadata.windows-installer]
# Each stable release and its preceding snapshots share a Windows Installer series.
series = "0.10"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Keep the model's feature-detected kernels compact in distribution builds.
[profile.release.package.dfn3_rs]
opt-level = 2

[profile.dev]
debug = 0
