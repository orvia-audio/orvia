[package]
name = "orvia-core"
description = "Audio processing and per-user settings for Orvia"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nnnoiseless = { git = "https://github.com/orvia-audio/nnnoiseless.git", rev = "5974c997bbfc782267fbc09b676ba30cc7b44029", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
fs2 = "0.4"
sys-locale = "0.3"
sonora = { git = "https://github.com/orvia-audio/sonora.git", rev = "037cad0e6d2203619909b3af9aeb0fcb98aceb64" }
dfn3_rs = { git = "https://github.com/orvia-audio/dfn3_rs.git", rev = "cb653a82b5e1fcf53266d70d624200de2823eeea" }

[dev-dependencies]
# Independent reference for bit-exact DSP parity across target-specific FFT implementations.
nnnoiseless-reference = { package = "nnnoiseless", version = "=0.5.2", default-features = false }

[lints]
workspace = true
