[package]
build = "../../assets/windows-icon.rs"
name = "orvia-engine"
description = "Resident microphone capture and playback engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
orvia-core = { path = "../core" }
cpal = "0.18.2"
anyhow = "1"
fs2 = "0.4"
rtrb = "0.4.1"
hound = "3.5"
tempfile = "3"
time = { version = "0.3", features = ["local-offset"] }
[target.'cfg(windows)'.dependencies]
tray-item = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
tao = { version = "0.37.3", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
tray-item = { version = "0.10", features = ["ksni"] }

[lints]
workspace = true

[build-dependencies]
embed-resource = "3"
resvg = { version = "0.50.0", default-features = false }
