[package]
build = "../../assets/windows-icon.rs"
name = "orvia"
description = "Orvia microphone mixer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
rust-embed = { version = "8", features = ["debug-embed"] }
orvia-core = { path = "../core" }
orvia-engine = { path = "../engine" }
semver = { version = "1", features = ["serde"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3"
resvg = { version = "0.50.0", default-features = false }
