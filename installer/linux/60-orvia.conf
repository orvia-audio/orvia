# Publish a playback sink for Orvia and a microphone for recording clients.
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=orvia_output rate=48000 channels=2 sink_properties='device.description=Orvia_Output priority.session=1'" flags = [ nofail ] }
    { cmd = "load-module" args = "module-remap-source master=orvia_output.monitor source_name=orvia_microphone channels=2 source_properties='device.description=Orvia_Microphone priority.session=1'" flags = [ nofail ] }
]
